<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OPF Video Scorecard</title>
<style>
  :root { --ink:#111; --mut:#666; --line:#e5e5e5; --bad:#c62828; --ok:#111; }
  * { box-sizing:border-box; } body { margin:0; font-family:-apple-system, Helvetica, Arial, sans-serif; color:var(--ink); background:#fafafa; }

  header b { font-size:16px; } header span { color:var(--mut); font-size:13px; }
  .wrap { display:grid; grid-template-columns: 1fr 1.2fr; gap:18px; padding:18px; max-width:1300px; margin:0 auto; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } .sticky { position:static !important; } }
  .sticky { position:sticky; top:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .list button { display:block; width:100%; text-align:left; padding:10px 12px; margin:6px 0; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; font-size:14px; }
  .list button.done { color:var(--mut); } .list button.sel { border-color:var(--ink); }
  .list small { display:block; color:var(--mut); }
  .video { aspect-ratio:16/9; width:100%; border:0; background:#000; border-radius:6px; }
  h3 { margin:14px 0 4px; font-size:15px; } h3 small { color:var(--mut); font-weight:normal; font-size:12px; margin-left:6px; }
  .q { color:var(--mut); font-size:13px; margin:0 0 8px; }
  .item { padding:10px 0; border-top:1px solid var(--line); }
  .item .t { font-size:14px; } .item .c { font-size:12px; color:var(--mut); margin:2px 0 6px; }
  .sc { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .sc button { width:38px; height:34px; border:1px solid var(--line); background:#fff; border-radius:6px; font-size:14px; cursor:pointer; }
  .sc button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .sc .na { width:auto; padding:0 10px; color:var(--mut); font-size:12px; }
  .note { width:100%; margin-top:6px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .note.req { border-color:var(--bad); background:#fff6f6; }
  .draft { font-size:11px; color:#a66; border:1px solid #e3c0c0; border-radius:4px; padding:1px 5px; margin-left:6px; }
  .foot { display:flex; gap:10px; align-items:center; margin-top:14px; }
  .btn { padding:10px 18px; border:0; background:var(--ink); color:#fff; border-radius:6px; font-size:14px; cursor:pointer; }
  .btn[disabled] { opacity:.4; } .msg { font-size:13px; color:var(--mut); } .msg.err { color:var(--bad); }
  input.w, select.w, textarea.w { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; margin-top:4px; }
  .tab { margin-right:12px; cursor:pointer; color:var(--mut); font-size:13px; } .tab.on { color:var(--ink); font-weight:600; text-decoration:underline; }
  .ff label { display:block; font-size:13px; margin-top:10px; } .ff label small { color:var(--mut); } textarea.w { min-height:60px; font-family:inherit; }
  .rules { font-size:12px; color:var(--mut); line-height:1.5; }
</style></head>
<body>
<header><b>OPF Video Scorecard</b><span><span id="tabs"></span> <span id="who"></span></span></header>
<div id="boot"><div class="card" style="margin:40px auto;max-width:520px">Loading...</div></div><template id="denied">
<div class="card" style="margin:40px auto;max-width:520px">This link is not valid. Ask Tom for your personal scoring link.</div>
</template><template id="apphtml">
<div class="wrap">
  <div>
    <div class="sticky">
      <div class="card"><b id="lhead">Videos to score</b><div class="list" id="list"></div>
        <div class="rules" id="rules" style="margin-top:10px">Score every item 1 to 5. The gray line says what a 5, a 3 and a 1 look like. If unsure, score lower. Leave N/A if it does not apply. A 1 or a 2 needs a note with the shot or timecode. Score alone; nothing is discussed until the quarterly review.</div>
      </div>
      <div class="card" id="vbox" style="display:none"><iframe id="player" class="video" allow="autoplay; fullscreen"></iframe><div id="vlink" style="font-size:12px;margin-top:6px"></div></div>
    </div>
  </div>
  <div>
    <div class="card" id="form" style="display:none"></div>
  </div>
</div>
</template><script type="text/plain" id="appjs">

  if ((m = u.match(/vimeo\.com\/(\d+)/))) return 'https://player.vimeo.com/video/' + m[1];
  if ((m = u.match(/(?:youtu\.be\/|v=)([\w-]{6,})/))) return 'https://www.youtube.com/embed/' + m[1];

}
function renderList() {

    b.innerHTML = '<b>' + v.title + '</b><small>' + (v.brand ? v.brand + ' · ' : '') + v.type + ' · due ' + v.due_date + (v.submitted ? ' · submitted ' + v.submitted_at + ' (editable until due)' : '') + '</small>';

}

}
var FACTQ = [
  ['video_url', 'Video link (Frame.io: click the thumbnail once, copy the address)', 'text', ''], ['video', 'Video title', 'text', ''],
  ['brand', 'Brand', 'select', '|OPF|Foxtail'], ['type', 'Type', 'select', '|Event|Wedding|AI|Promo'],
  ['client', 'Client', 'text', ''], ['delivered', 'Delivered', 'date', ''], ['runtime', 'Runtime', 'text', 'e.g. 01:29'],
  ['total_hours', 'Total hours, shoot + edit + revisions', 'text', 'e.g. shoot 2h, edit 4h, revision 1h'], ['edit_hours', 'Of which edit hours', 'text', ''],
  ['revision_rounds', 'Revision rounds after first delivery', 'text', ''], ['rounds_in_contract', 'Rounds in contract', 'text', ''],
  ['revision_cause', 'Main cause of revisions', 'select', '|none|us|client changed mind|unclear brief|mixed'],
  ['lufs', 'Delivered loudness, LUFS', 'text', 'target about -14 social, -23 broadcast'],
  ['client_words', 'Client reaction, their words pasted, not interpreted', 'area', ''], ['flagged', 'What they flagged', 'area', ''], ['praised', 'What they praised', 'area', ''],
  ['rebooked', 'Outcome (3 months later): rebooked or referred', 'select', '|yes|no|in progress'], ['posted_response', "Posted on client's channel, and the response", 'area', '']
];
var mode = 'score';
function tabs() {

}
function setMode(m) { mode = m; document.getElementById('lhead').textContent = m === 'facts' ? 'Fact sheets, this month' : m === 'review' ? 'Quarter' : 'Videos to score'; document.querySelector('.wrap').style.gridTemplateColumns = m === 'review' ? '220px 1fr' : ''; document.getElementById('rules').style.display = m === 'score' ? '' : 'none'; cur = null; tabs(); document.getElementById('form').style.display = 'none'; document.getElementById('vbox').style.display = 'none'; m === 'facts' ? renderFacts() : m === 'review' ? renderQuarters() : renderList(); }

function bar(v) { var w = Math.max(0, Math.min(100, (v - 1) / 4 * 100)); var c = v < 3 ? '#c62828' : v < 3.8 ? '#b8860b' : '#2e7d32'; return '<span style="display:inline-block;width:120px;height:8px;background:#eee;border-radius:4px;vertical-align:middle;margin-right:8px"><span style="display:block;width:' + w + '%;height:8px;background:' + c + ';border-radius:4px"></span></span><b>' + v.toFixed(1) + '</b>'; }
